name: ABI Verify (symbol CRC comparison)

# Verifies whether ci/abi-safe/abi-safe-code.patch keeps the exported-symbol CRCs
# identical to the current (known-bootable) configuration. Produces NO
# flashable image on purpose - artifacts are symbol tables and a report only.
on:
  workflow_dispatch:
  push:
    branches:
      - abi-verify

env:
  ARCH: arm64
  CLANG_VERSION: r547379
  LOCALVERSION: -android13-8

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ca-certificates dwarves flex gcc-aarch64-linux-gnu \
            libelf-dev libssl-dev python3 zip
          sudo apt-get clean
          echo "nproc=$(nproc)" >> "$GITHUB_ENV"

      - name: Fetch clang ${{ env.CLANG_VERSION }}
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 -b main \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/clang/linux-x86"
          cd "$HOME/clang/linux-x86"
          git sparse-checkout init --cone
          git sparse-checkout set "clang-${CLANG_VERSION}"
          git checkout main
          echo "CLANG_BIN=$HOME/clang/linux-x86/clang-${CLANG_VERSION}/bin" >> "$GITHUB_ENV"

      - name: Build BASELINE (current config) and export symbol CRCs
        run: |
          export PATH="${CLANG_BIN}:$PATH"
          mkdir -p "$HOME/out-base"
          make O="$HOME/out-base" ARCH=${ARCH} LLVM=1 LLVM_IAS=1 gki_defconfig
          # Image.gz alone never runs modpost, so build the modules too in
          # order to get Module.symvers (which holds the CRCs we compare).
          make O="$HOME/out-base" ARCH=${ARCH} LLVM=1 LLVM_IAS=1 -j${nproc} Image.gz
          # Module.symvers is emitted by modpost (reached via 'modules').
          # This config has only =m modules, so the step is cheap.
          make O="$HOME/out-base" ARCH=${ARCH} LLVM=1 LLVM_IAS=1 -j${nproc} modules
          test -f "$HOME/out-base/Module.symvers"
          cp "$HOME/out-base/Module.symvers" "$HOME/base.symvers"
          # Layout dump: the real safety bar on a device that does not
          # enforce module CRCs is that struct sizes/offsets stay put.
          dump_layout() {
            local v=$1 out=$2
            : > "$out"
            for st in task_struct css_set cgroup cgroup_root cgroup_subsys_state \
                      task_group cfs_rq rq cfs_bandwidth sched_entity sched_avg \
                      signal_struct mm_struct cgroup_subsys; do
              echo "### $st" >> "$out"
              pahole -C "$st" "$v" >> "$out" 2>/dev/null || echo "(absent)" >> "$out"
            done
          }
          dump_layout "$HOME/out-base/vmlinux" "$HOME/layout-base.txt"
          echo "baseline layout lines: $(wc -l < $HOME/layout-base.txt)"
          echo "baseline symbols: $(wc -l < $HOME/base.symvers)"

      - name: Apply patch into a SEPARATE worktree
        run: |
          set -e
          git worktree add "$HOME/patched" HEAD
          cd "$HOME/patched"
          # Apply the code patch. The defconfig file diff is excluded because
          # its context cannot match (our tree already enables IP6_NF_NAT);
          # the equivalent config edits are applied explicitly below.
          patch -p1 --forward < ci/abi-safe/abi-safe-code.patch
          grep -q '^CONFIG_CFS_BANDWIDTH=y'   arch/arm64/configs/gki_defconfig || \
            sed -i '/^CONFIG_CGROUP_SCHED=y$/a CONFIG_CFS_BANDWIDTH=y' arch/arm64/configs/gki_defconfig
          grep -q '^CONFIG_CGROUP_PIDS=y'      arch/arm64/configs/gki_defconfig || \
            sed -i '/^CONFIG_UCLAMP_TASK_GROUP=y$/a CONFIG_CGROUP_PIDS=y' arch/arm64/configs/gki_defconfig
          grep -q '^CONFIG_IP6_NF_TARGET_MASQUERADE=y' arch/arm64/configs/gki_defconfig || \
            sed -i '/^CONFIG_IP6_NF_NAT=y$/a CONFIG_IP6_NF_TARGET_MASQUERADE=y' arch/arm64/configs/gki_defconfig
          # Latent ACK defect: this line only compiles once CFS_BANDWIDTH is on.
          grep -q 'prandom_u32_max' kernel/sched/fair.c || {
            sed -i 's/^\t\t\t    get_random_u32_below(cfs_b->period));$/\t\t\t    prandom_u32_max(cfs_b->period));/' kernel/sched/fair.c
            sed -i '0,/^#include "sched.h"$/s//#include "sched.h"\n#include <linux\/prandom.h>/' kernel/sched/fair.c
          }
          echo "=== rejects (must be empty) ==="
          find . -name '*.rej' | tee /tmp/rejects.txt
          [ ! -s /tmp/rejects.txt ]
          echo "=== patch actually applied? (expect both present) ==="
          grep -q 'cfs_bandwidth_state' kernel/sched/sched.h && echo "sched.h: patched"
          grep -q 'css_set_get_subsys' include/linux/cgroup-defs.h && echo "cgroup-defs.h: patched"
          echo "=== patched defconfig lines ==="
          grep -nE '^CONFIG_(CFS_BANDWIDTH|CGROUP_PIDS|IP6_NF_NAT|IP6_NF_TARGET_MASQUERADE)=' arch/arm64/configs/gki_defconfig

      - name: Build PATCHED and export symbol CRCs
        run: |
          export PATH="${CLANG_BIN}:$PATH"
          mkdir -p "$HOME/out-pat"
          make -C "$HOME/patched" O="$HOME/out-pat" ARCH=${ARCH} LLVM=1 LLVM_IAS=1 gki_defconfig
          make -C "$HOME/patched" O="$HOME/out-pat" ARCH=${ARCH} LLVM=1 LLVM_IAS=1 -j${nproc} Image.gz
          make -C "$HOME/patched" O="$HOME/out-pat" ARCH=${ARCH} LLVM=1 LLVM_IAS=1 -j${nproc} modules
          test -f "$HOME/out-pat/Module.symvers"
          cp "$HOME/out-pat/Module.symvers" "$HOME/pat.symvers"
          dump_layout() {
            local v=$1 out=$2
            : > "$out"
            for st in task_struct css_set cgroup cgroup_root cgroup_subsys_state \
                      task_group cfs_rq rq cfs_bandwidth sched_entity sched_avg \
                      signal_struct mm_struct cgroup_subsys; do
              echo "### $st" >> "$out"
              pahole -C "$st" "$v" >> "$out" 2>/dev/null || echo "(absent)" >> "$out"
            done
          }
          dump_layout "$HOME/out-pat/vmlinux" "$HOME/layout-pat.txt"
          echo "patched layout lines: $(wc -l < $HOME/layout-pat.txt)"
          echo "patched symbols: $(wc -l < $HOME/pat.symvers)"

      - name: Compare CRCs and write report
        run: |
          set -e
          awk '{print $2, $1}' "$HOME/base.symvers" | sort > /tmp/b.txt
          awk '{print $2, $1}' "$HOME/pat.symvers"  | sort > /tmp/p.txt
          {
            echo "# ABI verify report"
            echo
            echo "- baseline symbols: $(wc -l < $HOME/base.symvers)"
            echo "- patched symbols:  $(wc -l < $HOME/pat.symvers)"
            echo
            echo "## symbols only in baseline (would disappear)"
            comm -23 <(cut -d' ' -f1 /tmp/b.txt) <(cut -d' ' -f1 /tmp/p.txt) | head -40
            echo
            echo "## symbols only in patched (would be new)"
            comm -13 <(cut -d' ' -f1 /tmp/b.txt) <(cut -d' ' -f1 /tmp/p.txt) | head -40
            echo
            echo "## CRC changes on common symbols"
            join /tmp/b.txt /tmp/p.txt | awk '$2!=$3 {print $1"  base="$2"  patched="$3}' > /tmp/changed.txt
            echo "changed count: $(wc -l < /tmp/changed.txt)"
            head -80 /tmp/changed.txt
            echo
            echo "## STRUCT LAYOUT DIFF (the real safety bar)"
            if diff -u "$HOME/layout-base.txt" "$HOME/layout-pat.txt" > /tmp/layout-diff.txt; then
              echo "layout IDENTICAL for all checked structs"
            else
              echo "layout DIFFERS - see below"
              head -120 /tmp/layout-diff.txt
            fi
          } > "$HOME/abi-report.md"
          cat "$HOME/abi-report.md"
          echo "=== VERDICT ==="
          echo "device does not enforce module CRCs, so CRC churn alone is not fatal;"
          echo "struct layout is the bar."
          if diff -q "$HOME/layout-base.txt" "$HOME/layout-pat.txt" >/dev/null; then
            echo "LAYOUT IDENTICAL: safe for prebuilt vendor modules (CRC churn is cosmetic here)."
          else
            echo "LAYOUT DIFFERS: patch is NOT safe - vendor modules would read wrong offsets."
          fi

      - name: Upload symbol tables and report
        uses: actions/upload-artifact@v4
        with:
          name: abi-verify-result
          path: |
            /home/runner/base.symvers
            /home/runner/pat.symvers
            /home/runner/abi-report.md
            /home/runner/layout-base.txt
            /home/runner/layout-pat.txt
          compression-level: 6
          if-no-files-found: error
