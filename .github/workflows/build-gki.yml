name: Build GKI Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - 'android13-*'
    paths:
      - 'arch/arm64/configs/**'
      - 'kernel/**'
      - 'mm/**'
      - 'security/**'
      - 'drivers/**'
      - 'include/**'
      - 'fs/**'
      - 'net/**'
      - '.github/workflows/build-gki.yml'

env:
  ARCH: arm64
  CLANG_VERSION: r547379
  # Stock GKI KMI suffix so `uname -r` matches the official GKI string
  LOCALVERSION: -android13-8
  KBUILD_BUILD_USER: build
  KBUILD_BUILD_HOST: build
  KBUILD_BUILD_TIMESTAMP: 'Thu Jun 5 12:00:00 UTC 2025'

jobs:
  build:
    name: Build android13-5.15 GKI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ca-certificates dwarves flex gcc-aarch64-linux-gnu \
            libelf-dev libssl-dev python3 zip
          sudo apt-get clean
          echo "nproc=$(nproc)" >> "$GITHUB_ENV"

      - name: Fetch clang ${{ env.CLANG_VERSION }}
        run: |
          # Official ACK kernel toolchain from AOSP prebuilts (build.config.constants)
          if ! git clone --filter=blob:none --no-checkout --depth 1 -b main \
               https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
               "$HOME/clang/linux-x86"; then
            echo "::warning::googlesource clone failed, falling back to community rolling clang"
            mkdir -p "$HOME/clang/linux-x86/clang-${CLANG_VERSION}"
            curl -sL "https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt" -o /tmp/clang-url.txt
            curl -L "$(cat /tmp/clang-url.txt)" -o /tmp/clang.tar.gz
            tar -xf /tmp/clang.tar.gz -C "$HOME/clang/linux-x86/clang-${CLANG_VERSION}" --strip-components=1
          else
            cd "$HOME/clang/linux-x86"
            git sparse-checkout init --cone
            git sparse-checkout set "clang-${CLANG_VERSION}"
            git checkout main
          fi
          "$HOME/clang/linux-x86/clang-${CLANG_VERSION}/bin/clang" --version
          echo "CLANG_BIN=$HOME/clang/linux-x86/clang-${CLANG_VERSION}/bin" >> "$GITHUB_ENV"

      - name: Guard against kABI-breaking configs
        run: |
          # CONFIG_CFS_BANDWIDTH / CONFIG_CGROUP_PIDS resize scheduler and
          # cgroup structs, which changes the CRC of thousands of exported
          # symbols. Without the ABI-safe wrapper they bootloop the device.
          #
          # They are allowed ONLY together with the ABI-safe patch that keeps
          # every struct size and member offset unchanged (verified by the
          # abi-verify workflow: task_struct 4544, css_set 424, cgroup 2400,
          # task_group 512, cfs_rq 384 - all identical before/after).
          if grep -qE '^CONFIG_(CFS_BANDWIDTH|CGROUP_PIDS)=y' arch/arm64/configs/gki_defconfig; then
            if ! grep -q 'cfs_bandwidth_state' kernel/sched/sched.h || \
               ! grep -q 'css_set_get_subsys' include/linux/cgroup-defs.h; then
              echo "::error::CFS_BANDWIDTH/CGROUP_PIDS enabled WITHOUT the ABI-safe wrapper - this bootloops the device. See README."
              exit 1
            fi
            echo "kABI guard: limits enabled WITH the ABI-safe wrapper (verified layout-preserving)"
          fi
          echo "kABI guard passed"

      - name: Configure and build
        run: |
          export PATH="${CLANG_BIN}:$PATH"
          make O=out ARCH=${ARCH} LLVM=1 LLVM_IAS=1 gki_defconfig
          make O=out ARCH=${ARCH} LLVM=1 LLVM_IAS=1 -j${nproc} Image.gz
          echo "Kernel release: $(make O=out ARCH=${ARCH} LLVM=1 kernelrelease)"

      - name: Verify kernel release string
        run: |
          REL=$(cat out/include/config/kernel.release)
          echo "uname -r will report: ${REL}"
          test -f out/arch/arm64/boot/Image.gz

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-android13-gki
          path: out/arch/arm64/boot/Image.gz
          compression-level: 0

      - name: Package AnyKernel3 flashable zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$HOME/AnyKernel3"
          rm -rf "$HOME/AnyKernel3/.git"
          # Replace the upstream Galaxy Nexus example config with a GKI
          # universal one: no device whitelist, auto-detected boot
          # partition, flash_boot (boot.img holds kernel only on GKI)
          cat > "$HOME/AnyKernel3/anykernel.sh" <<'EOF'
          ### AnyKernel3 GKI flashable
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=android13-5.15 GKI kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          } # end attributes

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # GKI: restricted flashing environments (app sandboxes, minimal recoveries)
          # may miss the /dev/block/by-name symlink directory that find_block expects.
          # Rebuild the link from whatever by-name dir exists; if there is none at
          # all, resolve the raw boot node (current slot first) and hand its full
          # path to find_block.
          if [ ! -e /dev/block/by-name ]; then
            BYNAMEDIR=$(find /dev/block -type d -name by-name 2>/dev/null | head -n 1);
            if [ -n "$BYNAMEDIR" ]; then
              ln -sfn "$BYNAMEDIR" /dev/block/by-name;
            else
              RAWBOOT=$(find /dev/block \( -name "boot$(cat /proc/cmdline 2>/dev/null | grep -o 'androidboot.slot_suffix=[a_b]*' | cut -d= -f2)" -o -name boot -o -name boot_a -o -name boot_b \) 2>/dev/null | sort | head -n 1);
              [ -n "$RAWBOOT" ] && BLOCK="$RAWBOOT";
            fi;
          fi;

          # boot install - same branch logic as the known-working upstream package:
          # split_boot+flash_boot when an init_boot ramdisk exists, dump_boot+write_boot
          # otherwise.
          if [ -L "/dev/block/bootdevice/by-name/init_boot_a" -o -L "/dev/block/by-name/init_boot_a" ]; then
              split_boot;
              flash_boot;
          else
              dump_boot;
              write_boot;
          fi;
          ## end boot install
          EOF
          cp out/arch/arm64/boot/Image.gz "$HOME/AnyKernel3/Image.gz"
          REL=$(cat out/include/config/kernel.release)
          cd "$HOME/AnyKernel3"
          zip -r9 "$GITHUB_WORKSPACE/AnyKernel3-GKI-${REL}.zip" . -x '.git*'

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-GKI-flashable
          path: AnyKernel3-GKI-*.zip
          compression-level: 0
